<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hathor – Concept Sandbox</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/styles/github.min.css"
    />
    <link rel="stylesheet" href="assets/shell.css" />
    <!-- Every partial's sheet, warmed but not applied.

         A partial carries its own `<link>` so its rules mount and unmount with
         it — that is what lets `uml/index.css` write a bare `.tab-bar` without
         reaching the Layouts page. But a link inserted by a swap does not block
         paint: the markup lands first and renders unstyled until its sheet
         arrives, which on a cold cache is a visible flash of the page you just
         asked for. Preloading here spends that round trip while the reader is
         still on the landing page, so the swap finds the sheet in cache.

         46 KB in total, against the 92 KB d3 bundle above. Keep this list in
         step with the partials — a sheet missing here still works, it just
         flashes once. -->
    <link rel="preload" as="style" href="partials/deck-render.css" />
    <link rel="preload" as="style" href="partials/definitions.css" />
    <link rel="preload" as="style" href="partials/fed-db.css" />
    <link rel="preload" as="style" href="partials/fed-search-query.css" />
    <link rel="preload" as="style" href="partials/layouts/index.css" />
    <link rel="preload" as="style" href="partials/layouts/last-season.css" />
    <link rel="preload" as="style" href="partials/layouts/layout-detail-page.css" />
    <link rel="preload" as="style" href="partials/layouts/layout-drawer.css" />
    <link rel="preload" as="style" href="partials/layouts/layout-dummy.css" />
    <link rel="preload" as="style" href="partials/layouts/layout-expandable.css" />
    <link rel="preload" as="style" href="partials/layouts/layout-master-detail.css" />
    <link rel="preload" as="style" href="partials/uml/dsl.css" />
    <link rel="preload" as="style" href="partials/uml/index.css" />
  </head>

  <body>
    <!-- ── Header ───────────────────────────────────────── -->
    <header>
      <div class="logo">Hathor <span>Sandbox</span></div>
      <nav>
        <a class="nav-cta" href="claude-design-v2.html">Concept</a>
        <!-- Sibling of this file on the publish branch, not a route of this
             page: `storybook-pages.yml` builds Storybook into `storybook/`
             beside the sandbox root, so the relative path resolves on the
             deployed site (entur.github.io/hathor/storybook/). It does not
             resolve in a local `concept-sandbox/` server — there, Storybook
             is `npm run storybook` on its own port. -->
        <a href="storybook/">Storybook</a>
      </nav>
    </header>

    <div class="layout">
      <!-- ── Side pane ──────────────────────────────────── -->
      <aside>
        <h2>Navigation</h2>
        <!-- Inherited by every nav button, so all eight share one request queue
             with `#main-content`'s own `hx-trigger="load"` fetch. htmx queues
             per element, and the landing fetch is issued by a *different*
             element than the button, so without this the two race for the same
             target: on a cold first paint a reader can click a page before the
             landing partial lands, and whichever response arrives last wins.
             Landing last silently replaces the page that was asked for; the
             page last lands after its own markup was already swapped away, and
             a partial whose script reads its own DOM (`deck-render.html`) dies
             on the first null — no page, no spinner, no visible error.

             On the `<ul>` rather than on `#main-content`: `hx-sync` is
             inherited, and swapped-in content would inherit it too — `layouts/`
             fires six `hx-trigger="load"` fetches at once and they would then
             abort each other. Nothing inside the nav issues a request of its
             own, so here it reaches exactly the eight buttons it should. -->
        <ul hx-sync="#main-content:replace" hx-indicator="#page-loading">
          <li>
            <button
              id="nav-database"
              hx-get="partials/database.html"
              hx-target="#main-content"
              hx-swap="innerHTML"
              onclick="selectNav(this)"
            >
              <span class="icon">&#128451;</span> Database
            </button>
          </li>
          <li>
            <button
              hx-get="partials/fed-search.html"
              hx-target="#main-content"
              hx-swap="innerHTML"
              onclick="selectNav(this)"
            >
              <span class="icon">&#128269;</span> Search
            </button>
          </li>
          <li>
            <button
              hx-get="partials/deck-render.html"
              hx-target="#main-content"
              hx-swap="innerHTML"
              onclick="selectNav(this)"
            >
              <span class="icon">&#9635;</span> Deck Render
            </button>
          </li>
          <li>
            <button
              hx-get="partials/layouts/index.html"
              hx-target="#main-content"
              hx-swap="innerHTML"
              onclick="selectNav(this)"
            >
              <span class="icon">&#9636;</span> Layouts
            </button>
          </li>
          <li>
            <button
              hx-get="partials/uml/index.html"
              hx-target="#main-content"
              hx-swap="innerHTML"
              onclick="selectNav(this)"
            >
              <span class="icon">&#9707;</span> UML
            </button>
          </li>
          <li>
            <button
              hx-get="partials/definitions.html"
              hx-target="#main-content"
              hx-swap="innerHTML"
              onclick="selectNav(this)"
            >
              <span class="icon">&#9638;</span> Definitions
            </button>
          </li>
          <li>
            <button
              hx-get="partials/about.html"
              hx-target="#main-content"
              hx-swap="innerHTML"
              onclick="selectNav(this)"
            >
              <span class="icon">&#9733;</span> About
            </button>
          </li>
          <li>
            <button
              hx-get="partials/stack.html"
              hx-target="#main-content"
              hx-swap="innerHTML"
              onclick="selectNav(this)"
            >
              <span class="icon">&#9881;</span> Tech Stack
            </button>
          </li>
        </ul>
        <div class="side-footer">Concept Sandbox v0.1</div>
      </aside>

      <!-- ── Main content ───────────────────────────────── -->
      <main>
        <!-- Sibling of the target, not a child of it: a swap replaces
             `#main-content`'s contents, so an indicator inside it would be
             thrown away by the first swap it reported on. -->
        <span id="page-loading" class="htmx-indicator" role="status">Loading…</span>
        <!-- `hx-disinherit`, because `hx-indicator` is inherited and everything
             swapped in here would point at the page pill too: `layouts/` fires
             six fetches on load and the search box one per keystroke, none of
             which is a page change. Disinherited, they fall back to htmx's
             default — the requesting element — and each partial keeps whatever
             loading affordance it has of its own. -->
        <div
          id="main-content"
          hx-trigger="load"
          hx-swap="innerHTML"
          hx-indicator="#page-loading"
          hx-disinherit="hx-indicator"
        ></div>
      </main>
    </div>

    <script>
      function selectNav(el) {
        document.querySelectorAll('aside li button').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
      }

      /** Characters that would end a text node or an attribute value early. */
      const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

      /**
       * Escape a value for interpolation into HTML — text or quoted attribute.
       *
       * Lives on the shell because partials cannot import each other without a
       * build step, and more than one of them renders mock-database values.
       * Everything drawn from the mock goes through this: field values, record
       * names, ids and keys are all equally free text as far as the markup is
       * concerned.
       *
       * @param {unknown} v Value to render as text.
       * @returns {string} `v` stringified, safe to interpolate into HTML.
       */
      function esc(v) {
        return String(v).replace(/[&<>"']/g, c => ESCAPES[c]);
      }

      /**
       * Deck-plan field naming that plan's decks: a path to a NeTEx fragment
       * file, relative to the sandbox root — which is also where the mock
       * database itself sits, so the same string resolves from either. `null`
       * on a plan that stores no decks.
       */
      const DECKS_REF_KEY = 'decksRef';

      /**
       * Deck-plan field naming that plan's source artwork: the legacy system's
       * own drawing of the railcar, as an SVG beside the fragment. It is what
       * the derived decks are read *against*, so it is a sibling file rather
       * than anything the NeTEx carries. Absent on a plan drawn by hand.
       */
      const SVG_REF_KEY = 'svgRef';

      /**
       * Whether a field holds a path to a sibling file rather than a value.
       *
       * @param {string} k Field name.
       * @returns {boolean} True for the two ref fields above.
       */
      const isRefKey = k => k === DECKS_REF_KEY || k === SVG_REF_KEY;

      /**
       * Render a ref as a link to the file it names.
       *
       * Shared so the two views that show a record — the database tree and the
       * search detail pane — cannot disagree on what a ref looks like.
       *
       * @param {string} ref Path to a sibling file, e.g. `mock-xml/x.decks.xml`.
       * @param {string} [label] Text to show in place of the path, for a row
       *   too narrow to carry one. The path itself stays reachable — it is the
       *   link's `title` and its href either way.
       * @returns {string} Anchor markup opening the file in a new tab.
       */
      function refLink(ref, label = ref) {
        return `<a class="db-link" href="${esc(ref)}" title="${esc(ref)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`;
      }

      /** Hash key naming one mock-database record: `#db=<netexId>`. */
      const DB_HASH_KEY = 'db';

      /**
       * Deep-link one mock-database record from any other page.
       *
       * The hash is set first, then the nav button is clicked: htmx re-swaps
       * the Database page, and the fresh `fed-db.html` reads the hash as it
       * builds the tree. Re-swapping on every call keeps that the partial's
       * only entry point, so it needs no listener of its own.
       *
       * @param {string} id NeTEx id of the record to open, e.g. `NMR:DeckPlan:13`.
       */
      function gotoDbItem(id) {
        location.hash = new URLSearchParams({ [DB_HASH_KEY]: id });
        document.getElementById('nav-database').click();
      }

      // Landing view: whatever the first nav item points at. The menu is the
      // single source of truth, so reordering it reorders the default. A `#db=`
      // deep link overrides, naming a record only the Database page shows.
      //
      // Assigned here rather than swapped after load: this script runs while
      // parsing, before htmx processes `#main-content`'s `load` trigger, so
      // there is no second fetch and no race over which response lands last.
      const landing = new URLSearchParams(location.hash.slice(1)).has(DB_HASH_KEY)
        ? document.getElementById('nav-database')
        : document.querySelector('aside li button[hx-get]');
      document
        .getElementById('main-content')
        .setAttribute('hx-get', landing.getAttribute('hx-get'));
      selectNav(landing);
    </script>
  </body>
</html>
