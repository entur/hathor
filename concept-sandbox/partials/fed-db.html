<style>
  .fed-db h2 {
    margin-bottom: 6px;
    font-size: 18px;
  }
  .fed-db details {
    border: 1px solid var(--clr-border);
    border-radius: var(--radius);
    margin-bottom: 6px;
    overflow: hidden;
  }
  .fed-db summary {
    padding: 10px 14px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    background: var(--clr-bg);
    display: flex;
    align-items: center;
    gap: 8px;
    list-style: none;
    user-select: none;
  }
  .fed-db summary::-webkit-details-marker {
    display: none;
  }
  .fed-db summary::before {
    content: '\25B6';
    font-size: 10px;
    color: var(--clr-text-dim);
    transition: transform 0.15s;
  }
  .fed-db details[open] > summary::before {
    transform: rotate(90deg);
  }
  .fed-db summary:hover {
    background: var(--clr-border);
  }
  .fed-db .db-count {
    margin-left: auto;
    font-weight: 400;
    font-size: 12px;
    color: var(--clr-text-dim);
  }
  .fed-db .tree {
    padding: 0;
    margin: 0;
  }
  .fed-db .tree-item {
    border-top: 1px solid var(--clr-border);
  }
  .fed-db .tree-item summary {
    padding: 6px 14px 6px 28px;
    font-weight: 500;
    font-size: 13px;
    background: var(--clr-surface);
    transition: background var(--transition);
  }
  .fed-db .tree-item summary::before {
    content: '\25B8';
    font-size: 9px;
  }
  .fed-db .tree-item[open] > summary::before {
    transform: rotate(90deg);
  }
  .fed-db .tree-fields {
    padding: 4px 14px 8px 42px;
    font-size: 12px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    line-height: 1.8;
    color: var(--clr-text);
  }
  .fed-db .tf-key {
    color: var(--clr-text-dim);
  }
  .fed-db .tf-str {
    color: #22863a;
  }
  .fed-db .tf-num {
    color: #005cc5;
  }
  .fed-db .intro {
    margin: 0 0 16px;
    color: var(--clr-text-dim);
    font-size: 14px;
    line-height: 1.6;
  }
  .fed-db .db-deck-icon {
    margin-left: auto;
    flex-shrink: 0;
    font-size: 14px;
    line-height: 1;
    color: var(--clr-accent);
  }
  /* The icon has taken over pushing to the right edge, so the id must not
     also claim the free space — two auto margins would split it and leave a
     gap between the pair. */
  .fed-db .db-deck-icon + .db-count {
    margin-left: 0;
  }
  .fed-db .tree-item.db-focus > summary {
    background: rgba(78, 108, 242, 0.18);
    color: var(--clr-accent);
  }
</style>

<div class="fed-db">
  <h2>Mock Database</h2>
  <p class="intro">Loaded source data, used by the other pages on this site.</p>
  <div id="db-accordion"></div>
</div>

<script type="module">
  const data = await fetch('mock-db-stem.json').then(r => r.json());

  const sections = [
    { key: 'vehicleTypes', label: 'Vehicle-Types', title: v => v.name },
    { key: 'vehicles', label: 'Vehicles', title: v => v.registrationNumber },
    { key: 'deckPlans', label: 'Deck-Plans', title: v => v.name },
  ];

  /** How long (ms) a deep-linked row stays highlighted after it opens. */
  const FLASH_MS = 2000;

  /**
   * Marker for a record whose decks are stored: U+25A3, the same glyph the
   * Deck Render nav item carries in `index.html`, so one symbol means "decks"
   * wherever it appears on the site.
   *
   * Labelled rather than left bare — a screen reader would otherwise announce
   * the character's Unicode name.
   */
  const DECK_ICON =
    '<span class="db-deck-icon" role="img" aria-label="Carries a decks fragment" title="Carries a decks fragment">&#9635;</span>';

  // `esc`, `refLink`, `DECKS_REF_KEY` and `DB_HASH_KEY` come from the shell
  // (index.html) — the detail pane in `fed-search-query.html` renders the same
  // records and must render a ref the same way.
  //
  // A deck-plan's decks are not stored here: the field holds a path to the
  // `<decks>` NeTEx fragment carrying them, shown as a link to that file rather
  // than as the tens of KB of markup it resolves to.
  const fmtVal = (k, v) =>
    k === DECKS_REF_KEY && v
      ? refLink(v)
      : typeof v === 'string'
        ? `<span class="tf-str">"${esc(v)}"</span>`
        : typeof v === 'number'
          ? `<span class="tf-num">${v}</span>`
          : `<span class="tf-key">${esc(v)}</span>`;

  const accordion = document.getElementById('db-accordion');

  for (const sec of sections) {
    const items = data[sec.key];
    const det = document.createElement('details');
    det.innerHTML = `<summary>${sec.label}<span class="db-count">${items.length}</span></summary>`;

    const tree = document.createElement('div');
    tree.className = 'tree';

    for (const item of items) {
      const node = document.createElement('details');
      node.className = 'tree-item';
      const fields = Object.entries(item)
        .map(([k, v]) => `<span class="tf-key">${esc(k)}:</span> ${fmtVal(k, v)}`)
        .join('<br>');
      node.dataset.id = item.id;
      const icon = item[DECKS_REF_KEY] ? DECK_ICON : '';
      node.innerHTML = `<summary>${esc(sec.title(item))}${icon}<span class="db-count">${esc(item.id)}</span></summary>
        <div class="tree-fields">${fields}</div>`;
      tree.append(node);
    }

    det.append(tree);
    accordion.append(det);
  }

  /**
   * Reveal one record: open its row and the section holding it, bring it into
   * view and flash it.
   *
   * `closest` starts at the node itself, which is a `.tree-item`, so the
   * `:not()` walks it up to the owning section rather than matching in place.
   *
   * A record the database does not hold is ignored — there is no page state to
   * report it in, and the tree stands as its own answer.
   *
   * @param {string} id NeTEx id of the record, unique across all three sections.
   */
  const openItem = id => {
    const node = accordion.querySelector(`.tree-item[data-id="${CSS.escape(id)}"]`);
    if (!node) return;
    node.closest('details:not(.tree-item)').open = true;
    node.open = true;
    node.scrollIntoView({ block: 'center', behavior: 'smooth' });
    node.classList.add('db-focus');
    setTimeout(() => node.classList.remove('db-focus'), FLASH_MS);
  };

  // Deep link. `gotoDbItem` (index.html) sets the hash and re-swaps this
  // partial, so reading it once at build time is the only entry point needed —
  // every request arrives as a fresh script run. Typing the hash into the
  // address bar works too, on whichever page currently hosts this partial.
  const wanted = new URLSearchParams(location.hash.slice(1)).get(DB_HASH_KEY);
  if (wanted) openItem(wanted);
</script>
