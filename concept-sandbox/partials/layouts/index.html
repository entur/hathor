<!-- Document-relative: htmx inserts this link into index.html, so the href
     resolves against *its* URL, not this partial's. -->
<link rel="stylesheet" href="partials/layouts/index.css" />

<div class="layouts-wrap">
  <div class="card">
    <!-- Level 1: group tabs -->
    <div class="group-bar">
      <button class="active" onclick="switchGroupTab(this, 'group-current')">Current</button>
      <button onclick="switchGroupTab(this, 'group-alternative')">Alternative</button>
    </div>

    <!-- Group: Current -->
    <div id="group-current" class="group-panel active">
      <div class="tab-bar">
        <button class="active" onclick="switchLayoutTab(this, 'tab-layout-dummy')">Table</button>
        <button onclick="switchLayoutTab(this, 'tab-detail-page')">Detail page</button>
        <button onclick="switchLayoutTab(this, 'tab-last-season')">Screenshot</button>
      </div>

      <div
        id="tab-layout-dummy"
        class="tab-panel active"
        hx-get="partials/layouts/layout-dummy.html"
        hx-trigger="load"
        hx-swap="innerHTML"
      ></div>
      <div
        id="tab-detail-page"
        class="tab-panel"
        hx-get="partials/layouts/layout-detail-page.html"
        hx-trigger="load"
        hx-swap="innerHTML"
      ></div>
      <div
        id="tab-last-season"
        class="tab-panel"
        hx-get="partials/layouts/last-season.html"
        hx-trigger="load"
        hx-swap="innerHTML"
      ></div>
    </div>

    <!-- Group: Alternative -->
    <div id="group-alternative" class="group-panel">
      <div class="tab-bar">
        <button class="active" onclick="switchLayoutTab(this, 'tab-drawer')">Drawer</button>
        <button onclick="switchLayoutTab(this, 'tab-expandable')">Expandable row</button>
        <button onclick="switchLayoutTab(this, 'tab-master-detail')">Master-detail</button>
      </div>

      <div
        id="tab-drawer"
        class="tab-panel active"
        hx-get="partials/layouts/layout-drawer.html"
        hx-trigger="load"
        hx-swap="innerHTML"
      ></div>
      <div
        id="tab-expandable"
        class="tab-panel"
        hx-get="partials/layouts/layout-expandable.html"
        hx-trigger="load"
        hx-swap="innerHTML"
      ></div>
      <div
        id="tab-master-detail"
        class="tab-panel"
        hx-get="partials/layouts/layout-master-detail.html"
        hx-trigger="load"
        hx-swap="innerHTML"
      ></div>
    </div>
  </div>
</div>

<script>
  function switchGroupTab(btn, panelId) {
    const card = btn.closest('.card');
    card.querySelectorAll('.group-bar button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    card.querySelectorAll('.group-panel').forEach(p => p.classList.remove('active'));
    document.getElementById(panelId).classList.add('active');
  }

  function switchLayoutTab(btn, panelId) {
    const group = btn.closest('.group-panel');
    group.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    group.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById(panelId).classList.add('active');
  }
</script>
