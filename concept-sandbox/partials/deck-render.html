<style>
  .deck-grid {
    display: flex;
    gap: 0.5rem;
    height: calc(100vh - var(--header-h) - 1rem);
  }
  .deck-grid > .card {
    margin: 0;
    min-width: 0;
    overflow-y: auto;
    height: 100%;
  }
  .deck-grid > .deck-list {
    flex: 0 0 280px;
  }
  /* The two comparison panes: the decks we derived, and the drawing they were
     derived from. Equal shares — neither is the reference copy of the other. */
  .deck-grid > .deck-stage,
  .deck-grid > .deck-art {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .deck-render h2 {
    margin-bottom: 12px;
    font-size: 18px;
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0 8px;
    min-width: 0;
  }
  /* Which pane this is, and which plan it shows. Both panes draw the same
     railcar, so an unlabelled heading would not say which drawing is which.
     The label never wraps mid-word: at three columns the qualifier takes the
     second line instead, which is the half that can be read at a glance. */
  .deck-render .pane-label {
    white-space: nowrap;
  }
  .deck-render .pane-sub {
    font-size: 12px;
    font-weight: 400;
    color: var(--clr-text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .deck-list ul {
    list-style: none;
    padding: 0;
  }
  .deck-list li button {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 8px 10px;
    border-radius: var(--radius);
    font-size: 14px;
    font-family: inherit;
    color: var(--clr-text);
    cursor: pointer;
    transition: background var(--transition);
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .deck-list li button:hover {
    background: var(--clr-bg);
  }
  .deck-list li button.selected {
    background: rgba(78, 108, 242, 0.1);
    color: var(--clr-accent);
    font-weight: 600;
  }
  .deck-list .dp-id {
    margin-left: auto;
    font-size: 11px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    color: var(--clr-text-dim);
    font-weight: 400;
  }
  .deck-stage .stage-host,
  .deck-art .art-host {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    overflow: auto;
  }
  .deck-stage .stage-meta,
  .deck-art .art-meta {
    flex-shrink: 0;
    padding-top: 12px;
    border-top: 1px solid var(--clr-border);
    font-size: 12px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    color: var(--clr-text-dim);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  /* Scoped to the page, not to one pane: both show notes. */
  .deck-render .stage-note {
    color: var(--clr-text-dim);
    font-size: 14px;
    line-height: 1.6;
    padding: 0 12px;
    text-align: center;
  }
  .deck-render .stage-note.error {
    color: #b42318;
  }
  /* Drawn at its own scale, contained rather than stretched — a source drawing
     resampled would stop being evidence of what the legacy system shows. The
     white plate is the artwork's own ground, extended under any letterboxing. */
  .deck-art .art-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    background: #fff;
    border-radius: 4px;
  }
  /* Bundle-load spinner. The renderer is a CDN ESM import with Vue bundled in,
     so on a cold cache the stage sits empty long enough that a bare line of
     text reads as a stall rather than as progress. */
  .deck-render .spin {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--clr-text-dim);
    font-size: 14px;
  }
  .deck-render .spin::before {
    content: '';
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    border: 2px solid var(--clr-border);
    border-top-color: var(--clr-accent);
    border-radius: 50%;
    animation: deck-spin 0.7s linear infinite;
  }
  .deck-stage .spin {
    flex-direction: column;
    gap: 12px;
  }
  .deck-stage .spin::before {
    width: 28px;
    height: 28px;
  }
  @keyframes deck-spin {
    to {
      transform: rotate(1turn);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .deck-render .spin::before {
      animation: deck-pulse 1.2s ease-in-out infinite;
    }
    @keyframes deck-pulse {
      50% {
        opacity: 0.25;
      }
    }
  }
</style>

<div class="deck-render deck-grid">
  <div class="card deck-list">
    <h2>Deck-Plans</h2>
    <ul id="deck-plan-list">
      <li><span class="spin" role="status">Loading…</span></li>
    </ul>
  </div>
  <div class="card deck-stage">
    <h2>
      <span class="pane-label">Deck rendering</span><span class="pane-sub" id="deck-title"></span>
    </h2>
    <div class="stage-host" id="deck-host">
      <span class="spin" role="status">Fetching the renderer…</span>
    </div>
    <div class="stage-meta" id="deck-meta"></div>
  </div>
  <div class="card deck-art">
    <h2>
      <span class="pane-label">Source artwork</span>
      <span class="pane-sub">as the legacy system draws it</span>
    </h2>
    <div class="art-host" id="deck-artwork"></div>
    <div class="art-meta" id="deck-art-meta"></div>
  </div>
</div>

<script type="module">
  /**
   * Read-only deck rendering, backed by the deck-plan editor's `<deck-rendering>`
   * custom element and fed from the same mock DB the federated search queries.
   *
   * The mock DB holds no deck markup: a deckPlan's `decksRef` names a NeTEx
   * fragment file rooted at `<decks>`, fetched here the first time that plan is
   * drawn. Plans holding no ref — still the common case on real data today —
   * are left out of the list entirely; the Database page marks which records
   * carry decks.
   *
   * Two panes, side by side, because the interesting question about a derived
   * deck is not what it looks like but whether it matches the railcar it came
   * from. The left pane draws the NeTEx we emit; the right shows `svgRef`, the
   * legacy system's own drawing of that same car. Reading one without the other
   * cannot tell a faithful lattice from a plausible-looking wrong one.
   */

  /**
   * Pinned build of the editor's web-component entry. Self-contained (Vue is
   * bundled in) and it registers `<deck-rendering>` as an import side effect,
   * guarded upstream by `customElements.get` — so a repeat htmx swap is free.
   */
  const EDITOR_URL =
    'https://cdn.jsdelivr.net/npm/@opentrainticketing/netex-deckplan-editor@2.0.5/dist/netex-deckplan-editor.es.js';

  /** Custom-element tag the bundle registers. */
  const TAG = 'deck-rendering';

  /** Stage padding (px) held back when fitting the drawing to the pane. */
  const FIT_PAD = 48;

  /** px-per-metre clamps: under MIN the seat labels collapse, over MAX the deck overflows. */
  const MIN_SCALE = 10,
    MAX_SCALE = 140;

  /** Debounce (ms) before a resize refits the scale. */
  const RESIZE_MS = 150;

  /** XML declaration a fragment file opens with, dropped before it is wrapped. */
  const DECL_RE = /^\s*<\?xml[^>]*\?>\s*/;

  /** Decimals kept on a derived extent — what the source coordinates carry. */
  const EXTENT_DP = 4;

  const grid = document.querySelector('.deck-render');
  const listEl = document.getElementById('deck-plan-list');
  const hostEl = document.getElementById('deck-host');
  const titleEl = document.getElementById('deck-title');
  const metaEl = document.getElementById('deck-meta');
  const artEl = document.getElementById('deck-artwork');
  const artMetaEl = document.getElementById('deck-art-meta');

  /**
   * Stylesheet for the element's shadow root.
   *
   * The package ships its renderer styles to a `dist/*.css` its `exports` map
   * does not expose, so nothing reaches the shadow root and seats would render
   * solid black on black. The sandbox therefore owns the appearance, painted
   * from its own `--clr-*` tokens. Selectors mirror what the renderer emits.
   *
   * @returns {CSSStyleSheet} A constructable sheet shared by every rendering.
   */
  const mkSheet = () => {
    const v = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const sheet = new CSSStyleSheet();
    sheet.replaceSync(`
      .vehicle-frame { background-color: ${v('--clr-bg')}; border-radius: 4px; }
      .vehicle-deck  { fill: ${v('--clr-surface')}; stroke: ${v('--clr-border')}; stroke-width: 2px; rx: 5px; }
      .seat .seat__base     { fill: rgba(78, 108, 242, 0.12); stroke: ${v('--clr-accent')}; stroke-width: 1px; rx: 5px; }
      .seat .seat__backrest { fill: ${v('--clr-accent')}; }
      .seat__text           { fill: ${v('--clr-text')}; stroke: none; pointer-events: none; }
      .door                 { fill: ${v('--clr-text-dim')}; stroke: ${v('--clr-text-dim')}; stroke-width: 1px; }
      /* Read-only: the element still emits \`select\`, but nothing consumes it. */
      .seat, .door { cursor: default; }
    `);
    return sheet;
  };

  /**
   * Replace a pane's contents with a line of prose.
   * @param {HTMLElement} el Pane host.
   * @param {string} msg Message.
   * @param {boolean} [isError] Whether to paint it as a failure.
   */
  const noteIn = (el, msg, isError) =>
    (el.innerHTML = `<span class="stage-note${isError ? ' error' : ''}">${esc(msg)}</span>`);

  const note = (msg, isError) => noteIn(hostEl, msg, isError);

  /** Same, for a step still in flight — a fragment on its way over the wire. */
  const waiting = msg => (hostEl.innerHTML = `<span class="spin" role="status">${esc(msg)}</span>`);

  /** Flatten a deck's spaces into the counts worth showing under the drawing. */
  const statsOf = deck => {
    const spaces = deck.deckspaces ?? [];
    const count = key => spaces.reduce((n, s) => n + (s[key]?.length ?? 0), 0);
    return {
      spaces: spaces.length,
      spots: count('passengerSpots'),
      entrances: count('deckEntrances'),
    };
  };

  /**
   * Scale that draws `deck` largest inside the stage, portrait.
   *
   * Orientation is fixed rather than measured. The source drawings beside it
   * are all portrait — the car's length runs down the page — and two panes in
   * opposite orientations cannot be read against each other, which is the only
   * reason they are side by side. It is also the roomier of the two here: a
   * deck is a long strip (13 × 2 m), so a pane this shape wastes most of its
   * box laid across, and the scale lands near the 36 px/m hathor's own sidebar
   * uses.
   *
   * @param {object} deck Deck from the renderer bundle's parser.
   * @returns {{vertical: boolean, scale: number}} Props for the element.
   */
  const fit = deck => {
    const { width, height } = deck.getBoundingBox();
    const availW = hostEl.clientWidth - FIT_PAD,
      availH = hostEl.clientHeight - FIT_PAD;
    if (!width || !height || availW <= 0 || availH <= 0)
      return { vertical: true, scale: MIN_SCALE };

    // Portrait: the deck's length spans the pane's height, its width the width.
    const scale = Math.min(availW / height, availH / width);
    return { vertical: true, scale: Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale)) };
  };

  /**
   * Vue's dev/prod branches survive the library build as 213 bare
   * `process.env.NODE_ENV` reads — bundler consumers substitute them, a page
   * loading the raw ESM must not leave them undefined or the import throws
   * `process is not defined` before the element is ever registered.
   */
  globalThis.process ??= { env: { NODE_ENV: 'production' } };

  const [mod, db] = await Promise.all([
    import(EDITOR_URL)
      .then(m => customElements.whenDefined(TAG).then(() => m.default))
      .catch(() => null),
    fetch('mock-db-stem.json')
      .then(r => r.json())
      .catch(() => null),
  ]);

  if (!mod || !db) {
    listEl.innerHTML = '';
    note('Could not load the renderer bundle or the mock database.', true);
  } else {
    const sheet = mkSheet();
    const plans = db.deckPlans ?? [];
    const drawable = plans.filter(p => p[DECKS_REF_KEY]);
    let current = null;

    /**
     * Direct children of an element by local name, namespace ignored.
     *
     * `getElementsByTagName*` walks the whole subtree, and a deck's spots and
     * entrances carry `Width`, `Length` and geometry of their own — asking the
     * deck for its width that way answers with a seat's.
     *
     * @param {Element} el Parent to look under.
     * @param {string} name Local name to match.
     * @returns {Element[]} Matching children, in document order.
     */
    const kids = (el, name) => [...el.children].filter(c => c.localName === name);

    /**
     * Restate every deck's extent in the two elements the renderer reads.
     *
     * A deck's size is the one thing a NeTEx document cannot say and the
     * renderer cannot do without. `Deck` extends `Zone` directly, so it never
     * reaches `OnboardSpace` and has no `Width` / `Length` in its content
     * model; what `Zone` gives it instead — `Centroid` and a `gml:Polygon` —
     * the 2.0.5 bundle drops on parse, its lowercase `polygon` key never
     * matching the `Polygon` that namespace-stripping hands it. With nothing to
     * read the constructor falls back to a literal 2.825 x 26.4 m car, which on
     * most of the corpus is narrower than its own seats: the stage sizes the
     * `<svg>` from that same figure and emits no `viewBox`, so the overflow is
     * clipped rather than merely drawn outside the outline.
     *
     * So the extent is copied from the outline into the elements the renderer
     * does read, and the document stops validating — which is the whole of what
     * this function does, and why it is named for it. Hand the result to
     * `parseNeTEx`, never to sobek, and never write it back to disk.
     *
     * The outline stays where it is. The renderer ignores it, and it is the
     * only statement of the extent a schema will take, so dropping it would
     * leave the fragment saying nothing true about its own size.
     *
     * `Width` and `Length` are appended last, out of the `xs:sequence` they
     * would need to sit in — the parser matches children by name, not by
     * position (verified against 2.0.5 with both placements), and an invalid
     * document is better off wearing its invalidity where a reader will see it.
     *
     * A deck already carrying `Width` — the editor's own samples do, which is
     * why they are the only fragments in the set that draw correctly — is left
     * exactly as it is.
     *
     * @param {string} validXML A `<decks>`-rooted fragment whose decks state
     *   their extent as a `gml:Polygon`, declaration included.
     * @returns {string} The same document with each deck's extent restated as
     *   `Width` / `Length`: renderable, and no longer schema-valid.
     * @throws {Error} If the document does not parse.
     */
    const invalidateXMLForDeckExtent = validXML => {
      const doc = new DOMParser().parseFromString(validXML, 'application/xml');
      const err = doc.querySelector('parsererror');
      if (err) throw new Error(`deck fragment does not parse: ${err.textContent.trim()}`);

      for (const deck of doc.getElementsByTagNameNS('*', 'Deck')) {
        if (kids(deck, 'Width').length) continue;

        // Zone > gml:Polygon > gml:exterior > gml:LinearRing > gml:posList.
        const ring = kids(deck, 'Polygon')
          .flatMap(poly => kids(poly, 'exterior'))
          .flatMap(ext => kids(ext, 'LinearRing'))
          .flatMap(lr => kids(lr, 'posList'))[0];
        if (!ring) continue;

        // `pos` is along-then-across, and the ring is written through the same
        // transpose — so the odd coordinates span the car's width.
        const co = ring.textContent.trim().split(/\s+/).map(Number);
        if (co.length < 4 || co.some(Number.isNaN)) continue;
        const span = off => {
          const vs = co.filter((_, i) => i % 2 === off);
          return Number((Math.max(...vs) - Math.min(...vs)).toFixed(EXTENT_DP));
        };

        for (const [name, m] of [
          ['Width', span(1)],
          ['Length', span(0)],
        ]) {
          const el = doc.createElementNS(deck.namespaceURI, name);
          el.textContent = String(m);
          deck.append(el);
        }
      }

      return (validXML.match(DECL_RE)?.[0] ?? '') + new XMLSerializer().serializeToString(doc);
    };

    /**
     * Put a `<decks>` fragment back inside the document its parser expects.
     *
     * `parseNeTEx` reaches straight down a fixed
     * `PublicationDelivery > … > ResourceFrame > deckPlans > DeckPlan` path, so
     * a bare fragment yields nothing. Only the frame around the decks is
     * rebuilt — the renderer reads no field outside `<Deck>`.
     *
     * @param {string} frag Contents of a fragment file, declaration included.
     * @returns {string} A document `parseNeTEx` accepts.
     */
    const wrapFrag = frag =>
      '<PublicationDelivery><dataObjects><CompositeFrame><frames><ResourceFrame><deckPlans>' +
      `<DeckPlan>${frag.replace(DECL_RE, '')}</DeckPlan>` +
      '</deckPlans></ResourceFrame></frames></CompositeFrame></dataObjects></PublicationDelivery>';

    /**
     * Decks already fetched and parsed, keyed by plan id.
     *
     * A refit on resize and a return to an earlier plan both redraw, and
     * neither should go back over the network or re-parse tens of KB. A failed
     * load stays out of the map, so selecting the plan again retries it.
     */
    const cache = new Map();

    /**
     * First deck of a plan, fetched and parsed on first use.
     *
     * The deck must come from *this* bundle's `parseNeTEx` — the renderer
     * matches deck spaces with `instanceof`, so a deck parsed by any other copy
     * of the models draws an empty outline.
     *
     * @param {object} plan Mock-DB deckPlan carrying a `decksRef`.
     * @returns {Promise<object|undefined>} The deck, or undefined if the
     *   fragment holds none.
     * @throws {Error} If the fragment cannot be fetched or parsed.
     */
    const deckOf = async plan => {
      const ref = plan[DECKS_REF_KEY];
      if (!cache.has(plan.id)) {
        const res = await fetch(ref);
        if (!res.ok) throw new Error(`${res.status} on ${ref}`);
        const frag = invalidateXMLForDeckExtent(await res.text());
        cache.set(plan.id, mod.parseNeTEx(wrapFrag(frag))[0]?.decks?.[0]);
      }
      return cache.get(plan.id);
    };

    /**
     * Show one plan's source artwork.
     *
     * An `<img>` rather than inlined markup: the drawings carry their own
     * `<style>` blocks with generic class names, which in SVG apply to the
     * whole document they land in — inlined, several of them would repaint the
     * rendering next door. An image document keeps each one to itself.
     *
     * Idempotent, because a resize redraws and swapping in a fresh `<img>` for
     * the same file would flash the pane. Nothing here refits: the CSS contains
     * the drawing at whatever size the pane is.
     *
     * Both handlers check `current` first, the same guard `draw` puts after
     * every await. Detaching an `<img>` neither cancels its fetch nor stops it
     * firing, so a reader who moves on mid-load would otherwise get the
     * previous plan's extents written under the new drawing — or, on an error,
     * that drawing replaced by a note about a file they are no longer looking
     * at.
     *
     * @param {object} plan Mock-DB deckPlan, artwork optional.
     */
    const drawArt = plan => {
      const ref = plan[SVG_REF_KEY];
      if (artEl.querySelector('img')?.getAttribute('src') === ref) return;
      artMetaEl.innerHTML = '';
      if (!ref)
        return noteIn(
          artEl,
          'No source artwork is stored for this plan — the fragment was drawn by hand.'
        );

      const img = document.createElement('img');
      img.className = 'art-img';
      img.alt = `Source drawing of ${plan.name}`;
      // The drawing's own pixel extent, not the size it is shown at: it is the
      // unit the legacy icon boxes were positioned in, so it is what the metres
      // in the pane opposite were scaled out of.
      img.onload = () => {
        if (current !== plan) return;
        artMetaEl.innerHTML =
          refLink(ref) + `<span>${img.naturalWidth} × ${img.naturalHeight} px</span>`;
      };
      img.onerror = () => current === plan && noteIn(artEl, `Could not load ${ref}.`, true);
      img.src = ref;
      artEl.replaceChildren(img);
    };

    /**
     * Draw one plan's first deck.
     *
     * The element is built detached and populated before insertion: Vue renders
     * in `connectedCallback` and dereferences `deck.getBoundingBox()` on that
     * first pass, so an element inserted before `deck` is assigned throws.
     *
     * Awaiting the fragment lets a second selection start before this one
     * lands, so every step past the await checks that `current` is still this
     * plan and drops out if the reader has moved on.
     *
     * @param {object} plan Mock-DB deckPlan carrying a `decksRef`.
     */
    const draw = async plan => {
      current = plan;
      titleEl.textContent = plan.name;
      // Ahead of the await: the artwork is a plain file and has no reason to
      // wait on the fragment fetch or on a parse that may yet fail.
      drawArt(plan);
      // Only on a first draw: a cached plan resolves within the same task and
      // would show the spinner for a single frame.
      if (!cache.has(plan.id)) {
        metaEl.textContent = '';
        waiting('Fetching the decks fragment…');
      }
      let deck;
      try {
        deck = await deckOf(plan);
      } catch (e) {
        if (current !== plan) return;
        metaEl.textContent = '';
        return note(`Could not load this plan: ${e.message}`, true);
      }
      if (current !== plan) return;
      if (!deck) {
        metaEl.textContent = '';
        return note('This fragment carries no decks.', true);
      }

      const el = document.createElement(TAG);
      Object.assign(el, { deck, ...fit(deck) });
      // Adopted before insertion so the drawing never flashes unstyled.
      if (el.shadowRoot?.adoptedStyleSheets) el.shadowRoot.adoptedStyleSheets = [sheet];
      hostEl.replaceChildren(el);

      const s = statsOf(deck);
      metaEl.innerHTML =
        `<button type="button" class="db-link" title="Show this record in the Mock Database">${esc(plan.id)}</button>` +
        refLink(plan[DECKS_REF_KEY]) +
        [
          `${s.spots} spots`,
          `${s.spaces} space${s.spaces === 1 ? '' : 's'}`,
          `${s.entrances} entrances`,
          `${deck.Length} × ${deck.Width} m`,
        ]
          .map(t => `<span>${t}</span>`)
          .join('');
      // `gotoDbItem` is the shell's (index.html); this page only names a record.
      metaEl.querySelector('button.db-link').onclick = () => gotoDbItem(plan.id);
    };

    const row = plan => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.innerHTML = `<span>${esc(plan.name)}</span><span class="dp-id">${esc(plan.id)}</span>`;
      btn.title = plan.description;
      btn.onclick = () => {
        listEl.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        draw(plan);
      };
      li.append(btn);
      return li;
    };

    listEl.innerHTML = '';
    drawable.forEach(p => listEl.append(row(p)));

    if (drawable.length) listEl.querySelector('button').click();
    else note('No deck plan in the database names a decks fragment.', true);

    // Refit on resize. Self-removing: the partial is swapped out by htmx, which
    // gives no unmount hook, so the handler drops itself once its DOM is gone.
    let timer;
    const onResize = () => {
      if (!document.body.contains(grid)) return window.removeEventListener('resize', onResize);
      clearTimeout(timer);
      timer = setTimeout(() => current && draw(current), RESIZE_MS);
    };
    window.addEventListener('resize', onResize);
  }
</script>
