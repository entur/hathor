<!-- Document-relative: htmx inserts this link into index.html, so the href
     resolves against *its* URL, not this partial's. -->
<link rel="stylesheet" href="partials/deck-render.css" />

<div class="deck-render deck-grid">
  <div class="card deck-list">
    <h2>Deck-Plans</h2>
    <ul id="deck-plan-list">
      <li><span class="spin" role="status">Loading…</span></li>
    </ul>
  </div>
  <div class="card deck-stage">
    <h2>
      <span class="pane-label">Deck rendering</span><span class="pane-sub" id="deck-title"></span>
      <span class="pane-src" id="deck-src"></span>
    </h2>
    <div class="pane-tools">
      <label>
        <input type="checkbox" id="deck-hack" />
        <span>Hack anchoring and rotation</span>
      </label>
      <!-- Outside the label: a button inside one is a second thing the label
           text activates, so clicking "rotation" would toggle the checkbox and
           open the dialog at once. -->
      <button type="button" class="info-btn" id="deck-hack-info" title="What this patches">
        <span aria-hidden="true">i</span>
        <span class="sr-only">What this patch changes</span>
      </button>
    </div>
    <div class="stage-host" id="deck-host">
      <span class="spin" role="status">Fetching the renderer…</span>
    </div>
    <div class="stage-meta" id="deck-meta"></div>
  </div>
  <div class="card deck-art">
    <h2>
      <span class="pane-label">Source artwork</span>
      <span class="pane-sub">as the legacy system draws it</span>
      <span class="pane-src" id="deck-art-src"></span>
    </h2>
    <!-- Nothing to put here: the artwork is a file, not something the page can
         re-anchor. It exists so `levelRows` can give this pane the height the
         stage's toggle takes, and the drawings stay side by side. -->
    <div class="pane-tools" id="deck-art-tools" aria-hidden="true"></div>
    <div class="art-host" id="deck-artwork"></div>
    <div class="art-meta" id="deck-art-meta"></div>
  </div>
</div>

<!-- Native <dialog>: Esc, the focus trap, focus restored to the button that
     opened it and an inert backdrop all come with it, and none of them are
     worth reimplementing for one explainer. -->
<dialog class="deck-info" id="deck-hack-dialog" aria-labelledby="deck-hack-dialog-title">
  <form method="dialog" class="info-close-form">
    <h3 id="deck-hack-dialog-title">What “hack anchoring and rotation” changes</h3>
    <button type="submit" class="info-close" aria-label="Close">&times;</button>
  </form>
  <!-- Static, so it survives every rebuild of the body below. The patches are
       the point of this dialog and they are not on this page; this is the way
       to them. -->
  <p class="info-source">
    <span>Patched by</span>
    <a
      href="https://github.com/entur/hathor/blob/ui-sandboxing/concept-sandbox/deck-ed-alignment-functions.js"
      target="_blank"
      rel="noopener noreferrer"
      >concept-sandbox/deck-ed-alignment-functions.js</a
    >
    <span class="info-source-repo">entur/hathor @ ui-sandboxing</span>
  </p>
  <div class="info-body" id="deck-hack-dialog-body"></div>
</dialog>

<script type="module">
  /**
   * Read-only deck rendering, backed by the deck-plan editor's `<deck-rendering>`
   * custom element and fed from the same mock DB the federated search queries.
   *
   * The mock DB holds no deck markup: a deckPlan's `decksRef` names a NeTEx
   * fragment file rooted at `<decks>`, fetched here the first time that plan is
   * drawn. Plans holding no ref — still the common case on real data today —
   * are left out of the list entirely; the Database page marks which records
   * carry decks.
   *
   * Two panes, side by side, because the interesting question about a derived
   * deck is not what it looks like but whether it matches the railcar it came
   * from. The left pane draws the NeTEx we emit; the right shows `svgRef`, the
   * legacy system's own drawing of that same car. Reading one without the other
   * cannot tell a faithful lattice from a plausible-looking wrong one.
   */

  /**
   * The two XML patches, and the constants describing what they rewrite.
   *
   * Kept in their own module because they are the one part of this page that is
   * not about this page: they document and work around four disagreements
   * between NeTEx and the renderer, and an upstream maintainer should be able
   * to read them without the sandbox around them.
   */
  import {
    DECL_RE,
    INVERTED_ORIENTATION,
    MIRRORED_ORIENTATION,
    hackXMLForDeckEdPlacement,
    invalidateXMLForDeckExtent,
    kids,
  } from './deck-ed-alignment-functions.js';

  /**
   * Pinned build of the editor's web-component entry. Self-contained (Vue is
   * bundled in) and it registers `<deck-rendering>` as an import side effect,
   * guarded upstream by `customElements.get` — so a repeat htmx swap is free.
   */
  const EDITOR_URL =
    'https://cdn.jsdelivr.net/npm/@opentrainticketing/netex-deckplan-editor@2.0.5/dist/netex-deckplan-editor.es.js';

  /** Custom-element tag the bundle registers. */
  const TAG = 'deck-rendering';

  /** Stage padding (px) held back when fitting the drawing to the pane. */
  const FIT_PAD = 48;

  /** px-per-metre clamps: under MIN the seat labels collapse, over MAX the deck overflows. */
  const MIN_SCALE = 10,
    MAX_SCALE = 140;

  /** Debounce (ms) before a resize refits the scale. */
  const RESIZE_MS = 150;

  /** Decimals shown for that extent: four are the parser's, not a reader's. */
  const DIM_DP = 2;

  const grid = document.querySelector('.deck-render');
  const listEl = document.getElementById('deck-plan-list');
  const hostEl = document.getElementById('deck-host');
  const titleEl = document.getElementById('deck-title');
  const metaEl = document.getElementById('deck-meta');
  const artEl = document.getElementById('deck-artwork');
  const artMetaEl = document.getElementById('deck-art-meta');
  const srcEl = document.getElementById('deck-src');
  const artSrcEl = document.getElementById('deck-art-src');
  const hackEl = document.getElementById('deck-hack');
  const infoBtn = document.getElementById('deck-hack-info');
  const dialogEl = document.getElementById('deck-hack-dialog');
  const infoBodyEl = document.getElementById('deck-hack-dialog-body');
  const toolsEl = document.querySelector('.deck-stage .pane-tools');
  const artToolsEl = document.getElementById('deck-art-tools');

  /**
   * The rows the two comparison panes share, each as a `[stage, artwork]` pair.
   * Everything between them is the drawing itself, which takes what is left.
   */
  const ROWS = [
    [document.querySelector('.deck-stage h2'), document.querySelector('.deck-art h2')],
    [toolsEl, artToolsEl],
    [metaEl, artMetaEl],
  ];

  /**
   * Stylesheet for the element's shadow root.
   *
   * The package ships its renderer styles to a `dist/*.css` its `exports` map
   * does not expose, so nothing reaches the shadow root and seats would render
   * solid black on black. The sandbox therefore owns the appearance, painted
   * from its own `--clr-*` tokens. Selectors mirror what the renderer emits.
   *
   * @returns {CSSStyleSheet} A constructable sheet shared by every rendering.
   */
  const mkSheet = () => {
    const v = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const sheet = new CSSStyleSheet();
    sheet.replaceSync(`
      .vehicle-frame { background-color: ${v('--clr-bg')}; border-radius: 4px; }
      .vehicle-deck  { fill: ${v('--clr-surface')}; stroke: ${v('--clr-border')}; stroke-width: 2px; rx: 5px; }
      .seat .seat__base     { fill: rgba(78, 108, 242, 0.12); stroke: ${v('--clr-accent')}; stroke-width: 1px; rx: 5px; }
      .seat .seat__backrest { fill: ${v('--clr-accent')}; }
      .seat__text           { fill: ${v('--clr-text')}; stroke: none; pointer-events: none; }
      .door                 { fill: ${v('--clr-text-dim')}; stroke: ${v('--clr-text-dim')}; stroke-width: 1px; }
      /* Read-only: the element still emits \`select\`, but nothing consumes it. */
      .seat, .door { cursor: default; }
    `);
    return sheet;
  };

  /**
   * Replace a pane's contents with a line of prose.
   * @param {HTMLElement} el Pane host.
   * @param {string} msg Message.
   * @param {boolean} [isError] Whether to paint it as a failure.
   */
  const noteIn = (el, msg, isError) =>
    (el.innerHTML = `<span class="stage-note${isError ? ' error' : ''}">${esc(msg)}</span>`);

  const note = (msg, isError) => noteIn(hostEl, msg, isError);

  /** Same, for a step still in flight — a fragment on its way over the wire. */
  const waiting = msg => (hostEl.innerHTML = `<span class="spin" role="status">${esc(msg)}</span>`);

  /**
   * Give the panes' headers one height and their footers another.
   *
   * The two rows wrap on their own contents: the stage's footer carries four
   * figures and two links to the artwork's two, and at three columns the
   * artwork's header takes a second line the stage's does not. Left alone,
   * whichever row is shorter hands its pane the difference — so the drawing
   * meant to be read against the one beside it gets a taller box, starts at a
   * different height on the page, and scrolls where the other does not, which
   * is the difference the width match was made to remove.
   *
   * Cleared before measuring so a row that has stopped wrapping — a wider
   * window, a shorter plan id — gives the height back.
   */
  const levelRows = () => {
    for (const pair of ROWS) for (const el of pair) el.style.minHeight = '';
    for (const pair of ROWS) {
      const h = Math.max(...pair.map(el => el.offsetHeight));
      for (const el of pair) el.style.minHeight = `${h}px`;
    }
  };

  /**
   * A ref's file kind — what is left of its name after the record's own stem.
   *
   * The link sits beside the record id it is named after, so the path spends
   * four times the width of what it adds. Nothing is lost: `refLink` keeps the
   * whole path as the link's `title` and its href.
   *
   * @param {string} ref Path to a sibling file.
   * @returns {string} e.g. `decks.xml`, `svg`.
   */
  const kindOf = ref => {
    const base = ref.split('/').pop();
    const dot = base.indexOf('.');
    return dot < 0 ? base : base.slice(dot + 1);
  };

  /** A deck extent at reading precision. @param {number} m Metres. */
  const fmtM = m => Number(m).toFixed(DIM_DP);

  /** Flatten a deck's spaces into the counts worth showing under the drawing. */
  const statsOf = deck => {
    const spaces = deck.deckspaces ?? [];
    const count = key => spaces.reduce((n, s) => n + (s[key]?.length ?? 0), 0);
    return {
      spaces: spaces.length,
      spots: count('passengerSpots'),
      entrances: count('deckEntrances'),
    };
  };

  /**
   * Scale that draws `deck` largest inside the stage, portrait.
   *
   * Orientation is fixed rather than measured. The source drawings beside it
   * are all portrait — the car's length runs down the page — and two panes in
   * opposite orientations cannot be read against each other, which is the only
   * reason they are side by side. It is also the roomier of the two here: a
   * deck is a long strip (13 × 2 m), so a pane this shape wastes most of its
   * box laid across, and the scale lands near the 36 px/m hathor's own sidebar
   * uses.
   *
   * @param {object} deck Deck from the renderer bundle's parser.
   * @returns {{vertical: boolean, scale: number}} Props for the element.
   */
  const fit = deck => {
    const { width, height } = deck.getBoundingBox();
    const availW = hostEl.clientWidth - FIT_PAD,
      availH = hostEl.clientHeight - FIT_PAD;
    if (!width || !height || availW <= 0 || availH <= 0)
      return { vertical: true, scale: MIN_SCALE };

    // Portrait: the deck's length spans the pane's height, its width the width.
    const scale = Math.min(availW / height, availH / width);
    return { vertical: true, scale: Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale)) };
  };

  /**
   * Vue's dev/prod branches survive the library build as 213 bare
   * `process.env.NODE_ENV` reads — bundler consumers substitute them, a page
   * loading the raw ESM must not leave them undefined or the import throws
   * `process is not defined` before the element is ever registered.
   */
  globalThis.process ??= { env: { NODE_ENV: 'production' } };

  const [mod, db] = await Promise.all([
    import(EDITOR_URL)
      .then(m => customElements.whenDefined(TAG).then(() => m.default))
      .catch(() => null),
    fetch('mock-db-stem.json')
      .then(r => r.json())
      .catch(() => null),
  ]);

  if (!mod || !db) {
    listEl.innerHTML = '';
    note('Could not load the renderer bundle or the mock database.', true);
  } else {
    const sheet = mkSheet();
    const plans = db.deckPlans ?? [];
    const drawable = plans.filter(p => p[DECKS_REF_KEY]);
    let current = null;

    /**
     * Width (px) the source drawing is laid out at, or 0 before the first fit.
     * Kept across plans so the next drawing can be seeded with the width the
     * pane already shows instead of appearing at its intrinsic size first.
     */
    let artW = 0;

    /**
     * Lay a drawing out at `px` wide.
     *
     * @param {HTMLImageElement} img Drawing.
     * @param {number} px Target width.
     * @param {boolean} animate Whether to travel there from its current width.
     */
    const widthTo = (img, px, animate) => {
      img.classList.add('fitted');
      img.classList.toggle('animate', animate);
      // Flush the outgoing width through style resolution first: a width set
      // in the same frame the class arrived has nothing to transition from,
      // and a cached plan gets both within one task.
      if (animate) void img.offsetWidth;
      img.style.width = `${px}px`;
      artW = px;
    };

    /**
     * Match the source drawing to the rendering's width on screen.
     *
     * Instant the first time a drawing is sized — animating out of its
     * intrinsic width would play a size nobody asked to see. Every later
     * change is animated, so a refit (a resize, or a plan whose deck lands at
     * a different scale) reads as the same drawing resized rather than as a
     * cut.
     *
     * @param {number} px Rendering width; ignored unless positive.
     */
    const fitArt = px => {
      const img = artEl.querySelector('img');
      const w = Math.round(px);
      if (!img || !(w > 0) || img.style.width === `${w}px`) return;
      widthTo(img, w, img.style.width !== '');
    };

    /**
     * Put a `<decks>` fragment back inside the document its parser expects.
     *
     * `parseNeTEx` reaches straight down a fixed
     * `PublicationDelivery > … > ResourceFrame > deckPlans > DeckPlan` path, so
     * a bare fragment yields nothing. Only the frame around the decks is
     * rebuilt — the renderer reads no field outside `<Deck>`.
     *
     * @param {string} frag Contents of a fragment file, declaration included.
     * @returns {string} A document `parseNeTEx` accepts.
     */
    const wrapFrag = frag =>
      '<PublicationDelivery><dataObjects><CompositeFrame><frames><ResourceFrame><deckPlans>' +
      `<DeckPlan>${frag.replace(DECL_RE, '')}</DeckPlan>` +
      '</deckPlans></ResourceFrame></frames></CompositeFrame></dataObjects></PublicationDelivery>';

    /**
     * Fragments already fetched, keyed by plan id — the bytes as served, before
     * either patch. Both readings of a plan are made from this one copy, so
     * toggling the hack costs a parse rather than a round trip. A failed fetch
     * stays out, so selecting the plan again retries it.
     */
    const text = new Map();

    /**
     * Decks already parsed, keyed by plan *and* by which patches made them.
     *
     * A refit on resize and a return to an earlier plan both redraw, and
     * neither should re-parse tens of KB. The reading is part of the key
     * because the two are different decks built from the same file: keyed on
     * the plan alone, flipping the toggle would hand back whichever one was
     * parsed first and the checkbox would look inert.
     */
    const cache = new Map();

    /** Cache key for one plan under one reading. */
    const keyOf = (plan, hacked) => `${plan.id}|${hacked ? 'hacked' : 'as-written'}`;

    /**
     * Renders started, so a slow one can tell it has been overtaken.
     *
     * `current` cannot tell it: flipping the toggle redraws the *same* plan, so
     * both passes see `current === plan` and a fetch that started first may
     * finish last and put the previous reading back on screen.
     */
    let gen = 0;

    /**
     * First deck of a plan, fetched and parsed on first use.
     *
     * The deck must come from *this* bundle's `parseNeTEx` — the renderer
     * matches deck spaces with `instanceof`, so a deck parsed by any other copy
     * of the models draws an empty outline.
     *
     * The extent patch is unconditional: without it most of the corpus draws
     * clipped inside a car that is not theirs, which is not a reading anyone
     * asked to compare against. The anchoring patch is the toggle's, and runs
     * second — it mirrors about the `Width` the first one writes.
     *
     * @param {object} plan Mock-DB deckPlan carrying a `decksRef`.
     * @returns {Promise<object|undefined>} The deck, or undefined if the
     *   fragment holds none.
     * @throws {Error} If the fragment cannot be fetched or parsed.
     */
    /**
     * A plan's fragment as served, fetched once.
     *
     * Separate from `deckOf` because the explainer dialog needs the same bytes
     * to show what the patch did to them, and neither reading should be the
     * one that owns the download.
     *
     * @param {object} plan Mock-DB deckPlan carrying a `decksRef`.
     * @returns {Promise<string>} The fragment text.
     * @throws {Error} If it cannot be fetched.
     */
    const fragOf = async plan => {
      if (!text.has(plan.id)) {
        const ref = plan[DECKS_REF_KEY];
        const res = await fetch(ref);
        if (!res.ok) throw new Error(`${res.status} on ${ref}`);
        text.set(plan.id, await res.text());
      }
      return text.get(plan.id);
    };

    const deckOf = async (plan, hacked) => {
      const key = keyOf(plan, hacked);
      if (!cache.has(key)) {
        // `hacked` is the reading the caller asked for, not whatever the
        // checkbox says now: the fetch above gives the reader time to flip it,
        // and re-reading it here would file this deck under the other key.
        let frag = invalidateXMLForDeckExtent(await fragOf(plan));
        if (hacked) frag = hackXMLForDeckEdPlacement(frag);
        cache.set(key, mod.parseNeTEx(wrapFrag(frag))[0]?.decks?.[0]);
      }
      return cache.get(key);
    };

    /**
     * Show one plan's source artwork.
     *
     * An `<img>` rather than inlined markup: the drawings carry their own
     * `<style>` blocks with generic class names, which in SVG apply to the
     * whole document they land in — inlined, several of them would repaint the
     * rendering next door. An image document keeps each one to itself.
     *
     * Idempotent, because a resize redraws and swapping in a fresh `<img>` for
     * the same file would flash the pane — and the width `fitArt` gave it
     * survives with it.
     *
     * Both handlers check `current` first, the same guard `draw` puts after
     * every await. Detaching an `<img>` neither cancels its fetch nor stops it
     * firing, so a reader who moves on mid-load would otherwise get the
     * previous plan's extents written under the new drawing — or, on an error,
     * that drawing replaced by a note about a file they are no longer looking
     * at.
     *
     * @param {object} plan Mock-DB deckPlan, artwork optional.
     */
    const drawArt = plan => {
      const ref = plan[SVG_REF_KEY];
      if (artEl.querySelector('img')?.getAttribute('src') === ref) return;
      artMetaEl.innerHTML = '';
      artSrcEl.innerHTML = ref ? refLink(ref, kindOf(ref)) : '';
      if (!ref)
        return noteIn(
          artEl,
          'No source artwork is stored for this plan — the fragment was drawn by hand.'
        );

      const img = document.createElement('img');
      img.className = 'art-img';
      img.alt = `Source drawing of ${plan.name}`;
      // The drawing's own pixel extent, not the size it is shown at: it is the
      // unit the legacy icon boxes were positioned in, so it is what the metres
      // in the pane opposite were scaled out of.
      img.onload = () => {
        if (current !== plan) return;
        artMetaEl.innerHTML = `<span>${img.naturalWidth}×${img.naturalHeight} px</span>`;
        levelRows();
      };
      img.onerror = () => current === plan && noteIn(artEl, `Could not load ${ref}.`, true);
      // Seeded at the width already on screen, unanimated: the rendering it
      // must match is a fetch and a parse away, and a drawing that appeared at
      // its intrinsic width first would resize twice for one selection.
      if (artW) widthTo(img, artW, false);
      img.src = ref;
      artEl.replaceChildren(img);
    };

    /**
     * Draw one plan's first deck.
     *
     * The element is built detached and populated before insertion: Vue renders
     * in `connectedCallback` and dereferences `deck.getBoundingBox()` on that
     * first pass, so an element inserted before `deck` is assigned throws.
     *
     * Awaiting the fragment lets a second selection start before this one
     * lands, so every step past the await checks that `current` is still this
     * plan and drops out if the reader has moved on.
     *
     * @param {object} plan Mock-DB deckPlan carrying a `decksRef`.
     */
    const draw = async plan => {
      const mine = ++gen;
      const hacked = hackEl.checked;
      current = plan;
      titleEl.textContent = plan.name;
      // Neither waits on the decks: both are read off the record itself, and
      // the heading is one of the rows `levelRows` measures, so it has to be
      // whole before anything is fitted to what it leaves.
      srcEl.innerHTML =
        `<button type="button" class="db-link" title="Show this record in the Mock Database">${esc(plan.id)}</button>` +
        refLink(plan[DECKS_REF_KEY], kindOf(plan[DECKS_REF_KEY]));
      // `gotoDbItem` is the shell's (index.html); this page only names a record.
      srcEl.querySelector('button.db-link').onclick = () => gotoDbItem(plan.id);
      // Ahead of the await: the artwork is a plain file and has no reason to
      // wait on the fragment fetch or on a parse that may yet fail.
      drawArt(plan);
      // Only on a first draw: a cached plan resolves within the same task and
      // would show the spinner for a single frame.
      if (!cache.has(keyOf(plan, hacked))) {
        metaEl.textContent = '';
        waiting('Fetching the decks fragment…');
      }
      let deck;
      try {
        deck = await deckOf(plan, hacked);
      } catch (e) {
        if (gen !== mine) return;
        metaEl.textContent = '';
        note(`Could not load this plan: ${e.message}`, true);
        return levelRows();
      }
      if (gen !== mine) return;
      if (!deck) {
        metaEl.textContent = '';
        note('This fragment carries no decks.', true);
        return levelRows();
      }

      const s = statsOf(deck);
      metaEl.innerHTML = [
        `${s.spots} spots`,
        `${s.spaces} space${s.spaces === 1 ? '' : 's'}`,
        `${s.entrances} entrances`,
        `${fmtM(deck.Length)}×${fmtM(deck.Width)} m`,
      ]
        .map(t => `<span>${t}</span>`)
        .join('');
      // Ahead of the drawing, not after it: levelling settles how much height
      // is left for the stage, and `fit` reads that height. Drawn first, the
      // deck would be sized against a pane a levelled footer then shrinks
      // under it, and overflow the box it was just fitted to. Both footers are
      // written on their own schedule — the artwork's on an image load that
      // may already have fired — so each levels the rows.
      levelRows();

      const el = document.createElement(TAG);
      Object.assign(el, { deck, ...fit(deck) });
      // Adopted before insertion so the drawing never flashes unstyled.
      if (el.shadowRoot?.adoptedStyleSheets) el.shadowRoot.adoptedStyleSheets = [sheet];
      hostEl.replaceChildren(el);

      // One scale across both panes — a drawing beside a rendering it is not
      // measurable against is decoration. The width is taken from the `<svg>`
      // rather than computed: `fit` clamps the scale, the element rotates, and
      // the renderer pads its frame, so nothing short of the laid-out element
      // states what the rendering actually occupies. Vue renders it in
      // `connectedCallback`, so it is there to measure the moment it is in.
      fitArt(el.shadowRoot?.querySelector('svg')?.getBoundingClientRect().width ?? 0);
    };

    const row = plan => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.innerHTML = `<span>${esc(plan.name)}</span><span class="dp-id">${esc(plan.id)}</span>`;
      btn.title = plan.description;
      btn.onclick = () => {
        listEl.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        draw(plan);
      };
      li.append(btn);
      return li;
    };

    // Redraws the plan already on screen rather than only the next one: the
    // toggle is a comparison control, and one worth making is the same car
    // before and after, not two different cars.
    hackEl.onchange = () => current && draw(current);

    /**
     * First descendant of `el` by local name, namespace ignored.
     * @param {Element|Document} el Root to search under.
     * @param {string} name Local name.
     * @returns {Element|undefined} The first match in document order.
     */
    const first = (el, name) => el.getElementsByTagNameNS('*', name)[0];

    /** A `<gml:pos>`'s two numbers, or undefined if `el` carries none. */
    const posOf = el => {
      const p = el && first(el, 'pos');
      return p ? { el: p, co: p.textContent.trim().split(/\s+/) } : undefined;
    };

    /**
     * One line of an XML excerpt, escaped for HTML, optionally highlighting the
     * fragment of it that the patch moved.
     *
     * @param {string} line Raw XML text.
     * @param {string} [hot] Substring to mark; ignored if absent from `line`.
     * @returns {string} HTML for one `<pre>` line.
     */
    const xmlLine = (line, hot) => {
      const safe = esc(line);
      const mark = hot && esc(hot);
      return mark && safe.includes(mark) ? safe.replace(mark, `<mark>${mark}</mark>`) : safe;
    };

    /**
     * A before/after pair of excerpts of the same element.
     * @param {string[][]} rows `[line, hotBefore, hotAfter]` per line.
     * @returns {string} HTML for the pair.
     */
    const diffPair = rows => {
      const col = i =>
        rows.map(([line, ...hot]) => xmlLine(line.replace('%s', hot[i]), hot[i])).join('\n');
      return (
        '<div class="info-diff">' +
        `<figure><figcaption>As written</figcaption><pre>${col(0)}</pre></figure>` +
        `<figure><figcaption>As the renderer is given it</figcaption><pre>${col(1)}</pre></figure>` +
        '</div>'
      );
    };

    /**
     * The explainer's body, written from the plan currently on screen.
     *
     * Built from that plan's own numbers rather than from an invented example:
     * this pane exists so a derived deck can be checked against the drawing it
     * came from, and an explainer that cannot be checked against either would
     * be one more thing to take on trust.
     *
     * @param {object} plan Mock-DB deckPlan carrying a `decksRef`.
     * @returns {Promise<string>} Dialog body HTML.
     */
    const explainHack = async plan => {
      const before = invalidateXMLForDeckExtent(await fragOf(plan));
      const after = hackXMLForDeckEdPlacement(before);
      const p = s => new DOMParser().parseFromString(s, 'application/xml');
      const [b, a] = [p(before), p(after)];
      const deck = first(b, 'Deck');
      const w = Number(kids(deck, 'Width')[0]?.textContent);
      const len = Number(kids(deck, 'Length')[0]?.textContent);

      const out = [];
      out.push(
        `<p class="info-lede">NeTEx writes a position <em>along the car, then across</em>; the
         drawing plots across first. That difference is a mirror, and the renderer only offers
         turns. Three faults, fixed before it sees the plan.</p>`,
        w > 0
          ? `<p class="info-rule">Deck ${fmtM(len)} × ${fmtM(w)} m &nbsp;→&nbsp; every across
             value <code>y</code> becomes <code>${fmtM(w)} − y</code></p>`
          : ''
      );

      // A seat: the plain case, one number on one line.
      const [bs, as] = [b, a].map(d => first(d, 'PassengerSpot'));
      const [bp, ap] = [bs, as].map(posOf);
      if (bp && ap) {
        const tag = bp.el.nodeName;
        const label = first(bs, 'Label')?.textContent.trim();
        out.push(
          '<h4>Every position moves across, never along</h4>',
          diffPair([
            [`<PassengerSpot id="${esc(bs.getAttribute('id') ?? '')}">`],
            ['  <Centroid><Location>'],
            [`    <${tag}>${bp.co[0]} %s</${tag}>`, bp.co[1], ap.co[1]],
            ['  </Location></Centroid>'],
            ...(label ? [[`  <Label>${esc(label)}</Label>`]] : []),
            ['</PassengerSpot>'],
          ])
        );
      }

      // A door: the case where something next to the moved number stays put.
      const [bd, ad] = [b, a].map(d => first(d, 'PassengerEntrance') ?? first(d, 'DeckEntrance'));
      const [bdp, adp] = [bd, ad].map(posOf);
      const side = bd && first(bd, 'VehicleSide')?.textContent.trim();
      if (bdp && adp && side) {
        const tag = bdp.el.nodeName;
        out.push(
          '<h4>Doors move — the side they name does not</h4>',
          `<p><code>${esc(side)}</code> was always right; the mirror is what draws it there.</p>`,
          diffPair([
            [`<${bd.nodeName} id="${esc(bd.getAttribute('id') ?? '')}">`],
            [`  <${tag}>${bdp.co[0]} %s</${tag}>`, bdp.co[1], adp.co[1]],
            [`  <VehicleSide>${esc(side)}</VehicleSide>`],
            [`</${bd.nodeName}>`],
          ])
        );
      }

      // Which way seats face, for the two separate reasons it is changed.
      const orients = [...b.getElementsByTagNameNS('*', 'Orientation')].map(o =>
        o.textContent.trim()
      );
      const anyOf = map => orients.find(v => map[v]);

      const along = anyOf(INVERTED_ORIENTATION);
      // Only the values actually rewritten: a plan can carry `unknown` spots
      // too, and those are left exactly as they are.
      const nAlong = orients.filter(v => INVERTED_ORIENTATION[v]).length;
      if (along)
        out.push(
          '<h4>Which way seats face — not the mirror</h4>',
          `<p>The renderer has these two the wrong way round: ${nAlong} of this plan's
           ${orients.length} spots face against the drawing until they are swapped.</p>`,
          diffPair([['  <Orientation>%s</Orientation>', along, INVERTED_ORIENTATION[along]]])
        );

      const sideways = anyOf(MIRRORED_ORIENTATION);
      if (sideways)
        out.push(
          '<h4>Sideways seats — this one is the mirror</h4>',
          diffPair([['  <Orientation>%s</Orientation>', sideways, MIRRORED_ORIENTATION[sideways]]])
        );

      // Each spot's own extent, on the axis the renderer reads it from.
      const [bw, bl] = ['Width', 'Length'].map(n => bs && kids(bs, n)[0]?.textContent.trim());
      if (bw && bl && bw !== bl) {
        const kind = first(bs, 'LocatableSpotType')?.textContent.trim();
        out.push(
          `<h4>How wide and long each ${esc(kind || 'spot')} is</h4>`,
          `<p>Read onto the wrong axes, so a ${esc(kind || 'spot')} is drawn turned a quarter
           circle. This one is ${bw} × ${bl} m — barely visible while those two are close,
           unmistakable once they are not.</p>`,
          diffPair([
            [`  <Width>%s</Width>`, bw, bl],
            [`  <Length>%s</Length>`, bl, bw],
          ])
        );
      }

      const on = t => `<span class="tag tag-on">${t}</span>`;
      const off = `<span class="tag tag-off">untouched</span>`;
      out.push(
        '<h4>Every element, touched or not</h4>',
        '<table><thead><tr><th>Element</th><th>What happens to it</th></tr></thead><tbody>' +
          [
            ['<code>&lt;pos&gt;</code> on every Centroid', on('mirrored'), 'across value only'],
            [
              '<code>&lt;posList&gt;</code>, the deck outline',
              on('mirrored'),
              'same size, other way round',
            ],
            [
              '<code>&lt;Orientation&gt;</code>',
              on('swapped'),
              'forwards ↔ backwards, leftwards ↔ rightwards',
            ],
            [
              '<code>&lt;Width&gt;</code>/<code>&lt;Length&gt;</code> on a spot',
              on('exchanged'),
              'read onto the opposite axes',
            ],
            ['<code>&lt;VehicleSide&gt;</code>', off, 'already correct'],
            [
              '<code>&lt;Width&gt;</code>/<code>&lt;Length&gt;</code> on the deck',
              off,
              'this renderer reads these correctly',
            ],
            ['<code>&lt;Label&gt;</code>, ids, refs', off, 'seat numbers must not reverse'],
          ]
            .map(([el, tag, why]) => `<tr><td>${el}</td><td>${tag} <em>${why}</em></td></tr>`)
            .join('') +
          '</tbody></table>',
        `<p class="info-note"><strong>A rendering patch, not a correction.</strong> The document
         going in is the one that is right. Never written to disk, never sent to sobek.</p>`
      );
      return out.join('');
    };

    // Built on open rather than on selection: it costs two parses of the
    // fragment, and most readers never ask.
    infoBtn.onclick = async () => {
      if (!current) return;
      const plan = current;
      infoBodyEl.innerHTML = '<p>Reading the fragment…</p>';
      dialogEl.showModal();
      let html;
      try {
        html = await explainHack(plan);
      } catch (e) {
        html = `<p class="info-note">Could not read this plan's fragment: ${esc(e.message)}</p>`;
      }
      // The reader may have closed it, or moved on, while it was being built.
      if (dialogEl.open && current === plan) infoBodyEl.innerHTML = html;
    };

    listEl.innerHTML = '';
    drawable.forEach(p => listEl.append(row(p)));

    if (drawable.length) listEl.querySelector('button').click();
    else note('No deck plan in the database names a decks fragment.', true);

    // Refit on resize. Self-removing: the partial is swapped out by htmx, which
    // gives no unmount hook, so the handler drops itself once its DOM is gone.
    let timer;
    const onResize = () => {
      if (!document.body.contains(grid)) return window.removeEventListener('resize', onResize);
      clearTimeout(timer);
      timer = setTimeout(() => current && draw(current), RESIZE_MS);
    };
    window.addEventListener('resize', onResize);
  }
</script>
