name: Build
'on':
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Configure git user
        run: |
          git config --global user.name 'Latest version bot'
          git config --global user.email 'latest-version-bot@entur.org'
      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - if: ${{ steps.cache-npm.outputs.cache-hit == 'false' }}
        name: List the state of node modules
        continue-on-error: true
        run: npm list
      - run: npm ci npm r--legacy-peer-deps
      - run: npm run check
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Bump version
        id: bump-version
        run: |
          npm version minor
          VERSION=$(npm pkg get version | tr -d \")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - run: npm run build
        env:
          REACT_APP_VERSION: ${{ steps.bump-version.outputs.version }}
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            build
      - name: Push version update to GitHub
        run: git push && git push --tags
  trigger-deployment:
    needs: build
    uses: ./.github/workflows/trigger-deployment.yml
    with:
      version: ${{ needs.build.outputs.version }}
    secrets:
      deployment_token: ${{ secrets.HATHOR_DEPLOYMENT_CONFIG_TOKEN }}