name: Build
'on':
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Read version and detect a merged version bump
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PREVIOUS_VERSION=$(git show "$BEFORE:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure git user
        run: |
          git config --global user.name 'Latest version bot'
          git config --global user.email 'latest-version-bot@entur.org'
      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - if: ${{ steps.cache-npm.outputs.cache-hit == 'false' }}
        name: List the state of node modules
        continue-on-error: true
        run: npm list
      - run: npm ci npm r--legacy-peer-deps
      - run: npm run check
      - name: Unit tests with coverage
        run: npm run test:coverage
      - run: npm run build
        env:
          REACT_APP_VERSION: ${{ steps.version.outputs.version }}
      - name: Archive production artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build
          path: |
            build
      - name: Tag the merged version
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [ "$(git rev-parse "$TAG^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG already points to a different commit."
              exit 1
            fi
          else
            git tag -a "$TAG" -m "$TAG"
          fi
          git push origin "refs/tags/$TAG"
      - name: Prepare version bump
        if: steps.version.outputs.release == 'false'
        id: bump-version
        run: |
          npm version minor --no-git-tag-version --ignore-scripts
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Open or update version-bump PR
        if: steps.version.outputs.release == 'false'
        id: version-pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: automation/version-bump
          delete-branch: true
          add-paths: |
            package.json
            package-lock.json
          author: Latest version bot <latest-version-bot@entur.org>
          commit-message: |
            chore: bump version to ${{ steps.bump-version.outputs.version }}

            Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>
          title: 'chore: bump version to ${{ steps.bump-version.outputs.version }}'
          body: |
            Automated minor version bump. Merge after the required checks pass
            to tag this version and trigger deployment.
      - name: Run required checks for the bot-created PR
        if: steps.version-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run playwright.yml --ref automation/version-bump
  trigger-deployment:
    needs: build
    if: needs.build.outputs.release == 'true'
    uses: ./.github/workflows/trigger-deployment.yml
    with:
      version: ${{ needs.build.outputs.version }}
    secrets:
      deployment_token: ${{ secrets.HATHOR_DEPLOYMENT_CONFIG_TOKEN }}