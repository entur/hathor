<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hathor – Concept Sandbox</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/styles/github.min.css"
    />
    <style>
      /* ── Reset & base ─────────────────────────────────── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --clr-bg: #f4f5f7;
        --clr-surface: #ffffff;
        --clr-primary: #181c3b;
        --clr-accent: #4e6cf2;
        --clr-accent-fg: #ffffff;
        --clr-text: #1e1e2e;
        --clr-text-dim: #6b7280;
        --clr-border: #e2e5ea;
        --header-h: 56px;
        --side-w: 260px;
        --radius: 8px;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
        --transition: 0.2s ease;
      }

      html {
        height: 100%;
      }

      body {
        height: 100%;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: var(--clr-text);
        background: var(--clr-bg);
        display: flex;
        flex-direction: column;
      }

      /* ── Header ───────────────────────────────────────── */
      header {
        height: var(--header-h);
        background: var(--clr-primary);
        color: #fff;
        display: flex;
        align-items: center;
        padding: 0 24px;
        gap: 16px;
        box-shadow: var(--shadow-md);
        z-index: 10;
        flex-shrink: 0;
      }

      header .logo {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      header .logo span {
        color: var(--clr-accent);
      }

      header nav {
        margin-left: auto;
        display: flex;
        gap: 8px;
      }

      header nav button,
      header nav a {
        display: inline-flex;
        align-items: center;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        padding: 6px 14px;
        border-radius: var(--radius);
        font-size: 13px;
        font-family: inherit;
        line-height: 1;
        text-decoration: none;
        cursor: pointer;
        transition:
          background var(--transition),
          border-color var(--transition),
          transform var(--transition);
      }

      header nav button:hover:not(:disabled),
      header nav button.active,
      header nav a:hover {
        background: var(--clr-accent);
        border-color: var(--clr-accent);
      }

      header nav .nav-cta {
        background: var(--clr-accent);
        border-color: var(--clr-accent);
        font-weight: 600;
        box-shadow: 0 0 0 2px rgba(78, 108, 242, 0.25);
      }

      header nav .nav-cta:hover {
        background: #3d59d9;
        border-color: #3d59d9;
        transform: translateY(-1px);
      }

      header nav button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* ── Layout beneath header ────────────────────────── */
      .layout {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* ── Side pane ────────────────────────────────────── */
      aside {
        width: var(--side-w);
        background: var(--clr-surface);
        border-right: 1px solid var(--clr-border);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        overflow-y: auto;
      }

      aside h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--clr-text-dim);
        padding: 20px 20px 8px;
      }

      aside ul {
        list-style: none;
        padding: 0 8px;
      }

      aside li button {
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        padding: 10px 12px;
        border-radius: var(--radius);
        font-size: 14px;
        color: var(--clr-text);
        cursor: pointer;
        transition: background var(--transition);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      aside li button:hover {
        background: var(--clr-bg);
      }

      aside li button.selected {
        background: rgba(78, 108, 242, 0.1);
        color: var(--clr-accent);
        font-weight: 600;
      }

      aside li button .icon {
        width: 20px;
        text-align: center;
        font-size: 16px;
        flex-shrink: 0;
      }

      aside .side-footer {
        margin-top: auto;
        padding: 16px 20px;
        font-size: 12px;
        color: var(--clr-text-dim);
        border-top: 1px solid var(--clr-border);
      }

      /* ── Main content ─────────────────────────────────── */
      main {
        flex: 1;
        overflow: hidden;
        padding: 0;
      }

      #main-content {
        width: 100%;
        height: 100%;
        overflow-y: auto;
      }

      .card {
        background: var(--clr-surface);
        border: 1px solid var(--clr-border);
        border-radius: var(--radius);
        padding: 28px 32px;
        box-shadow: var(--shadow-sm);
        margin: 32px 40px;
      }

      /* A card that *is* the page: fills the viewport below the header and
         scrolls its own content. Partials that fill `#main-content` use it
         instead of restating the height budget. */
      .page-card {
        margin: 0.5rem;
        height: calc(100vh - var(--header-h) - 1rem);
        overflow-y: auto;
      }

      /* Button that reads as a link — the affordance for `gotoDbItem`, so it
         lives beside the function rather than in each calling partial. */
      .db-link {
        background: none;
        border: none;
        padding: 0;
        font: inherit;
        color: var(--clr-accent);
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
      }

      .card h1 {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .card p {
        color: var(--clr-text-dim);
        line-height: 1.6;
        margin-bottom: 20px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 10px 20px;
        border: none;
        border-radius: var(--radius);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background var(--transition),
          transform var(--transition);
      }

      .btn-primary {
        background: var(--clr-accent);
        color: var(--clr-accent-fg);
      }

      .btn-primary:hover {
        background: #3d59d9;
        transform: translateY(-1px);
      }

      .btn-outline {
        background: transparent;
        color: var(--clr-accent);
        border: 1px solid var(--clr-accent);
      }

      .btn-outline:hover {
        background: rgba(78, 108, 242, 0.08);
      }

      .btn-group {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      /* ── HTMX response area ───────────────────────────── */
      #response-area {
        margin-top: 24px;
        min-height: 24px;
      }

      .response-card {
        background: #f0f4ff;
        border: 1px solid #d0d9f7;
        border-radius: var(--radius);
        padding: 16px 20px;
        font-size: 14px;
        color: var(--clr-text);
        animation: fadeIn 0.3s ease;
      }

      .response-card code {
        background: rgba(78, 108, 242, 0.1);
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 13px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ── htmx loading indicator ───────────────────────── */
      .htmx-indicator {
        display: none;
        margin-left: 8px;
      }
      .htmx-request .htmx-indicator,
      .htmx-request.htmx-indicator {
        display: inline-block;
      }

      /* ── Responsive ───────────────────────────────────── */
      @media (max-width: 768px) {
        aside {
          display: none;
        }
        .card {
          margin: 20px 16px;
        }
      }
    </style>
  </head>

  <body>
    <!-- ── Header ───────────────────────────────────────── -->
    <header>
      <div class="logo">Hathor <span>Sandbox</span></div>
      <nav>
        <a class="nav-cta" href="claude-design-v2.html">Concept</a>
        <button disabled>Dashboard</button>
        <button disabled>Settings</button>
      </nav>
    </header>

    <div class="layout">
      <!-- ── Side pane ──────────────────────────────────── -->
      <aside>
        <h2>Navigation</h2>
        <ul>
          <li>
            <button
              id="nav-database"
              hx-get="partials/database.html"
              hx-target="#main-content"
              hx-swap="innerHTML"
              onclick="selectNav(this)"
            >
              <span class="icon">&#128451;</span> Database
            </button>
          </li>
          <li>
            <button
              hx-get="partials/fed-search.html"
              hx-target="#main-content"
              hx-swap="innerHTML"
              onclick="selectNav(this)"
            >
              <span class="icon">&#128269;</span> Search
            </button>
          </li>
          <li>
            <button
              hx-get="partials/deck-render.html"
              hx-target="#main-content"
              hx-swap="innerHTML"
              onclick="selectNav(this)"
            >
              <span class="icon">&#9635;</span> Deck Render
            </button>
          </li>
          <li>
            <button
              hx-get="partials/layouts/index.html"
              hx-target="#main-content"
              hx-swap="innerHTML"
              onclick="selectNav(this)"
            >
              <span class="icon">&#9636;</span> Layouts
            </button>
          </li>
          <li>
            <button
              hx-get="partials/uml/index.html"
              hx-target="#main-content"
              hx-swap="innerHTML"
              onclick="selectNav(this)"
            >
              <span class="icon">&#9707;</span> UML
            </button>
          </li>
          <li>
            <button
              hx-get="partials/definitions.html"
              hx-target="#main-content"
              hx-swap="innerHTML"
              onclick="selectNav(this)"
            >
              <span class="icon">&#9638;</span> Definitions
            </button>
          </li>
          <li>
            <button
              hx-get="partials/about.html"
              hx-target="#main-content"
              hx-swap="innerHTML"
              onclick="selectNav(this)"
            >
              <span class="icon">&#9733;</span> About
            </button>
          </li>
          <li>
            <button
              hx-get="partials/stack.html"
              hx-target="#main-content"
              hx-swap="innerHTML"
              onclick="selectNav(this)"
            >
              <span class="icon">&#9881;</span> Tech Stack
            </button>
          </li>
        </ul>
        <div class="side-footer">Concept Sandbox v0.1</div>
      </aside>

      <!-- ── Main content ───────────────────────────────── -->
      <main>
        <div id="main-content" hx-trigger="load" hx-swap="innerHTML"></div>
      </main>
    </div>

    <script>
      function selectNav(el) {
        document.querySelectorAll('aside li button').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
      }

      /** Characters that would end a text node or an attribute value early. */
      const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

      /**
       * Escape a value for interpolation into HTML — text or quoted attribute.
       *
       * Lives on the shell because partials cannot import each other without a
       * build step, and more than one of them renders mock-database values.
       * Everything drawn from the mock goes through this: field values, record
       * names, ids and keys are all equally free text as far as the markup is
       * concerned.
       *
       * @param {unknown} v Value to render as text.
       * @returns {string} `v` stringified, safe to interpolate into HTML.
       */
      function esc(v) {
        return String(v).replace(/[&<>"']/g, c => ESCAPES[c]);
      }

      /**
       * Deck-plan field naming that plan's decks: a path to a NeTEx fragment
       * file, relative to the sandbox root — which is also where the mock
       * database itself sits, so the same string resolves from either. `null`
       * on a plan that stores no decks.
       */
      const DECKS_REF_KEY = 'decksRef';

      /**
       * Render a `decksRef` as a link to the fragment it names.
       *
       * Shared so the two views that show a record — the database tree and the
       * search detail pane — cannot disagree on what a ref looks like.
       *
       * @param {string} ref Path to a `<decks>` fragment, e.g. `mock-xml/x.xml`.
       * @returns {string} Anchor markup opening the fragment in a new tab.
       */
      function refLink(ref) {
        return `<a class="db-link" href="${esc(ref)}" target="_blank" rel="noopener noreferrer">${esc(ref)}</a>`;
      }

      /** Hash key naming one mock-database record: `#db=<netexId>`. */
      const DB_HASH_KEY = 'db';

      /**
       * Deep-link one mock-database record from any other page.
       *
       * The hash is set first, then the nav button is clicked: htmx re-swaps
       * the Database page, and the fresh `fed-db.html` reads the hash as it
       * builds the tree. Re-swapping on every call keeps that the partial's
       * only entry point, so it needs no listener of its own.
       *
       * @param {string} id NeTEx id of the record to open, e.g. `NMR:DeckPlan:13`.
       */
      function gotoDbItem(id) {
        location.hash = new URLSearchParams({ [DB_HASH_KEY]: id });
        document.getElementById('nav-database').click();
      }

      // Landing view: whatever the first nav item points at. The menu is the
      // single source of truth, so reordering it reorders the default. A `#db=`
      // deep link overrides, naming a record only the Database page shows.
      //
      // Assigned here rather than swapped after load: this script runs while
      // parsing, before htmx processes `#main-content`'s `load` trigger, so
      // there is no second fetch and no race over which response lands last.
      const landing = new URLSearchParams(location.hash.slice(1)).has(DB_HASH_KEY)
        ? document.getElementById('nav-database')
        : document.querySelector('aside li button[hx-get]');
      document
        .getElementById('main-content')
        .setAttribute('hx-get', landing.getAttribute('hx-get'));
      selectNav(landing);
    </script>
  </body>
</html>
